<div
  #container
  [class]="containerClasses()"
  [attr.role]="isDisabled() ? null : 'button'"
  [attr.tabindex]="isDisabled() ? null : 0"
>
  @if (arrowPosition() === 'before' && renderArrow()) {
    <ng-container *ngTemplateOutlet="arrow" />
  }
  <span [class]="labelClasses()"><ng-content /></span>
  @if (arrowPosition() === 'after' && renderArrow()) {
    <ng-container *ngTemplateOutlet="arrow" />
  }
</div>

<ng-template #arrow>
  <span [class]="arrowClasses()" data-tw-sort-arrow>
    <ng-content select="[twSortHeaderIcon]">
      <svg
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
        [class]="arrowIconClasses()"
      >
        <path
          fill-rule="evenodd"
          d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd"
        />
      </svg>
    </ng-content>
  </span>
</ng-template>
