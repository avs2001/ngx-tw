name: e2e

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Nightly full suite at 03:00 UTC.
    - cron: '0 3 * * *'
    # Weekly visual sweep on Sundays at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Cancel stale runs on the same ref — saves CI minutes on PR pushes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: every job only reads source and up/downloads artifacts.
# Pin the token read-only rather than inheriting the repo default.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Build the library once and share it as an artifact. Every e2e job
  # below depends on this — the demo app imports `@cdevhub/ngx-tw/*`
  # from `dist/`, so running the build in each job (`npm run build:lib`,
  # ~25 s × 7 jobs) burns CI minutes for the same output. The pattern
  # mirrors `ci.yml`'s `build-lib` + `download-artifact` setup.
  # ────────────────────────────────────────────────────────────────────

  build-lib:
    name: build library (shared dist artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build ngx-tw (production)
        run: npm run build:lib
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # PR — required checks
  # ────────────────────────────────────────────────────────────────────

  e2e-smoke:
    name: e2e — smoke (chromium-light)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ──────────────────────────────────────────────────────────────
      # `test.fixme` registry guard.
      #
      # `e2e/support/fixme-registry.ts` gives every suppression a dated expiry
      # and `specs/00-smoke/fixme-registry.spec.ts` fails once `reviewBy`
      # passes. Neither can check the *pairing* — that every `test.fixme` title
      # carries a `[fixme:<id>]` prefix naming a real row, and that no row is
      # left orphaned by a deleted call site. Both directions need to read the
      # source tree, and a spec cannot `import 'node:fs'` because
      # `@types/node` is not a dependency of this workspace (the same gap the
      # audit register records against `scripts/verify-theme-parity.mjs`). So
      # the source scan lives here, where a shell has no such problem. It runs
      # before the Playwright install so it fails in seconds, not minutes.
      # ──────────────────────────────────────────────────────────────
      - name: Guard — every test.fixme carries a registry id, every id is used
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          # The two conditional in-body `test.fixme(cond, msg)` calls in this
          # file gate the ARIA_CONTROLS_BACKLOG / ACCESSIBLE_NAME_BACKLOG sets.
          # They take a boolean, not a title, and their expiry already lives in
          # those backlogs — so they are exempt by design, not by oversight.
          EXEMPT = {'e2e/specs/03-accessibility/explicit-assertions.spec.ts'}

          specs = sorted(Path('e2e/specs').rglob('*.spec.ts'))
          bare, used = [], set()
          for path in specs:
              text = path.read_text()
              if str(path) in EXEMPT:
                  continue
              lines = text.split('\n')
              for n, line in enumerate(lines):
                  if not re.match(r'^\s*test\.fixme\(', line):
                      continue
                  window = '\n'.join(lines[n:n + 3])
                  match = re.search(r"'\[fixme:([^\]]+)\]", window)
                  if match:
                      used.add(match.group(1))
                  else:
                      bare.append(f'{path}:{n + 1}')

          registry = Path('e2e/support/fixme-registry.ts').read_text()
          declared = set(re.findall(r"^\s*id: '([^']+)',", registry, re.M))

          problems = []
          if bare:
              problems.append(
                  'test.fixme call sites with no registry id — the title must '
                  "start with '[fixme:<area>/<slug>] ':\n  " + '\n  '.join(bare))
          orphans = sorted(declared - used)
          if orphans:
              problems.append(
                  'registry entries no call site references — delete them:\n  '
                  + '\n  '.join(orphans))
          unknown = sorted(used - declared)
          if unknown:
              problems.append(
                  'ids used by a call site but missing from the registry:\n  '
                  + '\n  '.join(unknown))

          if problems:
              print('\n\n'.join(problems))
              sys.exit(1)
          print(f'fixme registry OK — {len(used)} suppressions, all registered, no orphans.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Scope key by the browser set this job installs — otherwise the
          # chromium-only smoke job wins the race to populate the cache, and
          # subsequent jobs that need firefox/webkit get a stale chromium-only
          # cache + a skipped install step → "Executable doesn't exist" crashes.
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Smoke
        run: npm run e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-a11y:
    name: e2e — accessibility (chromium-light)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: A11y sweep (light + dark)
        run: npm run e2e:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  # Merge to develop + nightly — full sharded suite
  # ────────────────────────────────────────────────────────────────────

  e2e-full:
    name: e2e — full (${{ matrix.shard }} of ${{ matrix.total }})
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # `-all` keeps this cache disjoint from the chromium-only jobs so a
          # fast-finishing smoke job can't shadow firefox/webkit binaries here.
          key: ${{ runner.os }}-pw-all-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (all browsers)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Full suite (shard ${{ matrix.shard }}/${{ matrix.total }})
        # `--grep-invert @visual` excludes the visual sweep — visual has
        # its own job below with chromium-only baselines.
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.total }} --grep-invert @visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-full-merge:
    name: e2e — merge gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [e2e-full]
    steps:
      - run: echo "All full-suite shards passed."

  # ────────────────────────────────────────────────────────────────────
  # Visual regression — runs on merge + weekly, PLUS any PR that touches a
  # baseline PNG.
  #
  # Why this gate exists (audit pass 5 → 6). The visual job used to run only
  # on `push`/`schedule`/`workflow_dispatch`, and the workflow's `push`
  # trigger is scoped to `develop`. A feature branch therefore got `skipping`
  # on every PR run, so the first thing that genuinely exercised a
  # regenerated baseline was the push to `develop` AFTER merge — a bad
  # baseline turned `develop` red rather than the PR that introduced it.
  #
  # That compounds a second property: `e2e-update-baselines.yml` runs
  # `--update-snapshots`, which makes that job pass BY DEFINITION — it
  # records whatever renders. The job that writes baselines always passed
  # and the only job that could contradict it never ran on the PR.
  #
  # Why detection instead of "just run it on every PR": the CI-minutes
  # argument in this file's header is real — the visual job is a 15-minute
  # budget with its own browser install, and 99% of PRs do not touch a PNG.
  # `visual-baseline-scope` below is a checkout + one `git diff` (~15 s), so
  # steady-state PR cost is unchanged while a baseline-touching PR gets the
  # full sweep against the COMMITTED baselines — the one run that
  # `--update-snapshots` cannot fake.
  #
  # Why a job-level condition and not a workflow-level `paths:` filter: a
  # `paths:` filter on the `pull_request` trigger gates the WHOLE workflow,
  # which would stop `e2e-smoke` and `e2e-a11y` — the two required PR
  # checks — from running on any PR that does not touch a screenshot.
  # ────────────────────────────────────────────────────────────────────

  visual-baseline-scope:
    name: e2e — visual baseline scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      baselines-changed: ${{ steps.detect.outputs.baselines-changed }}
    steps:
      # `fetch-depth: 2` is enough: on a `pull_request` event the checked-out
      # ref is `refs/pull/N/merge`, whose first parent is the base-branch tip.
      # `HEAD^1..HEAD` is therefore exactly the PR's own diff, with no full
      # clone and no extra action dependency.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Detect baseline changes
        id: detect
        run: |
          set -uo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # push / schedule / workflow_dispatch run the visual job on their
            # own trigger conditions; nothing to detect.
            echo "baselines-changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --name-only HEAD^1 HEAD -- e2e/__screenshots__ 2>/dev/null)"; then
            # Fail SAFE, not open: if the merge-base is unavailable for any
            # reason we run the visual job rather than silently skipping the
            # only check that can contradict a regenerated baseline.
            echo "Could not diff against the base ref — running the visual job anyway."
            echo "baselines-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$changed" ]]; then
            echo "Baseline PNGs changed in this PR:"
            echo "$changed"
            echo "baselines-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline PNGs changed in this PR."
            echo "baselines-changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-visual:
    name: e2e — visual canary (chromium)
    # `visual-baseline-scope` deliberately carries no `if:` — a SKIPPED
    # dependency propagates the skip to every job that `needs` it, which
    # would silently disable the visual job on push/schedule too.
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') || github.event_name == 'workflow_dispatch' || needs.visual-baseline-scope.outputs.baselines-changed == 'true'
    runs-on: ubuntu-latest
    needs: [build-lib, visual-baseline-scope]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Visual sweep
        # Canary spec uses both chromium projects (light + dark). The
        # `@visual` grep is the source of truth for which tests run.
        run: npm run e2e -- --grep @visual --project=chromium-light --project=chromium-dark
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 30
