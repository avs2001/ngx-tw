name: e2e

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Nightly full suite at 03:00 UTC.
    - cron: '0 3 * * *'
    # Weekly visual sweep on Sundays at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Cancel stale runs on the same ref — saves CI minutes on PR pushes.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin a stable node + playwright image. `bookworm` matches the playwright
# docker image's base and provides the system fonts the demo loads.
env:
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Build the library once and share it as an artifact. Every e2e job
  # below depends on this — the demo app imports `@cdevhub/ngx-tw/*`
  # from `dist/`, so running the build in each job (`npm run build:lib`,
  # ~25 s × 7 jobs) burns CI minutes for the same output. The pattern
  # mirrors `ci.yml`'s `build-lib` + `download-artifact` setup.
  # ────────────────────────────────────────────────────────────────────

  build-lib:
    name: build library (shared dist artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build ngx-tw (production)
        run: npm run build:lib
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # PR — required checks
  # ────────────────────────────────────────────────────────────────────

  e2e-smoke:
    name: e2e — smoke (chromium-light)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Scope key by the browser set this job installs — otherwise the
          # chromium-only smoke job wins the race to populate the cache, and
          # subsequent jobs that need firefox/webkit get a stale chromium-only
          # cache + a skipped install step → "Executable doesn't exist" crashes.
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Smoke
        run: npm run e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-a11y:
    name: e2e — accessibility (chromium-light)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: A11y sweep (light + dark)
        run: npm run e2e:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  # Merge to develop + nightly — full sharded suite
  # ────────────────────────────────────────────────────────────────────

  e2e-full:
    name: e2e — full (${{ matrix.shard }} of ${{ matrix.total }})
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # `-all` keeps this cache disjoint from the chromium-only jobs so a
          # fast-finishing smoke job can't shadow firefox/webkit binaries here.
          key: ${{ runner.os }}-pw-all-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (all browsers)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Full suite (shard ${{ matrix.shard }}/${{ matrix.total }})
        # `--grep-invert @visual` excludes the visual sweep — visual has
        # its own job below with chromium-only baselines.
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.total }} --grep-invert @visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-full-merge:
    name: e2e — merge gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [e2e-full]
    steps:
      - run: echo "All full-suite shards passed."

  # ────────────────────────────────────────────────────────────────────
  # Visual regression — runs on merge + weekly
  # ────────────────────────────────────────────────────────────────────

  e2e-visual:
    name: e2e — visual canary (chromium)
    if: github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-lib]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist-e2e
          path: dist/ngx-tw
      - name: Visual sweep
        # Canary spec uses both chromium projects (light + dark). The
        # `@visual` grep is the source of truth for which tests run.
        run: npm run e2e -- --grep @visual --project=chromium-light --project=chromium-dark
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 30
