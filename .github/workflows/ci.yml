name: ci

# CI gate for the ngx-tw library. Runs on every PR targeting `develop` and on
# every push to `develop`.
#
# ADVISORY, NOT ENFORCED. As of the last audit `develop` has no branch
# protection and no rulesets (`GET /branches/develop/protection` → 404,
# `GET /rulesets` → []), so a red run here does not block a merge or a push.
# `scripts/release.mjs` is what actually gates a release on these results.
#
# The node version comes from `.nvmrc` (`node-version-file:` below) so local
# development and CI cannot drift apart. It must satisfy the `engines` range
# that Angular 22 declares — `^22.22.3 || ^24.15.0 || >=26.0.0`.
#
# To make these checks binding, add them as required status checks:
#   gh api -X PUT repos/{owner}/{repo}/branches/develop/protection \
#     -F required_status_checks[strict]=true \
#     -F 'required_status_checks[contexts][]=lint' \
#     ...
# Note that doing so will break `release.mjs`'s direct
# `git push origin develop --follow-tags` unless admins are allowed to bypass.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: every job here only reads source and up/downloads
# artifacts. Pin the token to read-only rather than inheriting the repo
# default (which may be read-write).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-lib:
    name: build library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build ngx-tw (production)
        run: npm run build:lib
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-tw-dist
          path: dist/ngx-tw
          retention-days: 7

  mcp-index:
    name: MCP index validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory here, like every job in this workflow — the binding gate is the
    # local pre-flight in scripts/release.mjs, which runs the same script before
    # anything publishes. Running it on the PR too surfaces breakage where it is
    # cheap to fix rather than at release time.
    #
    # Regenerates the index from source rather than downloading the build-lib
    # artifact: the script's whole job is to check source, demo, and guidance
    # against each other, and it builds its own index in memory to do so.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate MCP index (coverage, links, snippet API, imports)
        run: npm run verify:mcp-index

  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tests import from `@cdevhub/ngx-tw/*`, which tsconfig.paths maps to
    # `./dist/ngx-tw/*`. Without the built artifact, esbuild falls back through
    # the workspace symlink to raw source, and components with templateUrl
    # (form-field, tabs, table, …) fail to compile in TestBed because their
    # templates aren't inlined. Stage dist/ from the build-lib job first.
    needs: [build-lib]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist
          path: dist/ngx-tw
      - run: npm run test:ci

  pack-check:
    name: npm pack dry-run + consumer install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-lib]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ngx-tw-dist
          path: dist/ngx-tw
      - name: Verify publishable tarball
        # Fails the job if the package would publish something it shouldn't
        # (missing README, missing LICENSE, oversized bundle, etc.).
        run: |
          cd dist/ngx-tw
          npm pack --dry-run --json | tee ../pack-manifest.json
          node -e "
            const m = require('../pack-manifest.json')[0];
            const must = ['README.md', 'LICENSE', 'package.json'];
            const have = new Set(m.files.map(f => f.path));
            const missing = must.filter(f => !have.has(f));
            if (missing.length) { console.error('Missing files in tarball:', missing); process.exit(1); }
            console.log('Tarball OK —', m.files.length, 'files,', (m.size/1024).toFixed(1), 'KB');
          "
      - name: Verify a consumer can actually install and style the library
        # Installs the packed tarball into a scratch project OUTSIDE the repo and
        # compiles the theme with Tailwind. Catches the two failure modes that
        # every other gate misses, because the demo app imports the theme by
        # relative path and Tailwind auto-detects the raw monorepo source:
        #   1. the `exports` map blocking the documented theme subpath
        #   2. a dead `@source` glob emitting zero component utilities (silent —
        #      Tailwind does not warn about a glob that matches nothing)
        run: npm run verify:package
