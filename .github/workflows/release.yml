name: release

# Tag-driven publish pipeline for @cdevhub/ngx-tw.
#
# Triggered by pushes of release tags shaped `@cdevhub/ngx-tw@<version>`,
# which are created by `npm run release:patch|minor|major` running locally.
# On a tag push this job:
#   1. Builds the library and runs unit tests + pack-check against the tag SHA.
#   2. Verifies the tag version matches the package.json version (mismatch =
#      somebody pushed a hand-crafted tag; refuse to publish).
#   3. Publishes `dist/ngx-tw/` to npm with provenance.
#   4. Creates the matching GitHub Release, using the changelog section for
#      this version as the release body.

on:
  push:
    tags:
      - '@cdevhub/ngx-tw@*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm + create release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # required for `npm publish --provenance` attestation
      # NOTE: provenance also requires `NPM_TOKEN` to be a Granular Access Token
      # (or legacy Automation token) from a 2FA-enabled npm account. A classic
      # "Read+Write" token will fail the publish, not silently skip provenance.
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          # Need history for changelog extraction and tag verification.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run unit tests
        run: npm run test:ci

      - name: Verify publishable tarball
        # Mirrors ci.yml — refuse to publish a tarball missing README/LICENSE.
        run: |
          cd dist/ngx-tw
          npm pack --dry-run --json | tee ../pack-manifest.json
          node -e "
            const m = require('../pack-manifest.json')[0];
            const must = ['README.md', 'LICENSE', 'package.json'];
            const have = new Set(m.files.map(f => f.path));
            const missing = must.filter(f => !have.has(f));
            if (missing.length) { console.error('Missing files in tarball:', missing); process.exit(1); }
            console.log('Tarball OK —', m.files.length, 'files,', (m.size/1024).toFixed(1), 'KB');
          "

      - name: Verify a consumer can actually install and style the library
        # Mirrors ci.yml. This is the last gate before publish that exercises the
        # package the way a consumer does rather than the way this repo does.
        run: npm run verify:package

      - name: Verify tag matches dist version
        # A mismatch means someone pushed a tag that doesn't correspond to the
        # version on the tagged commit — refuse to publish that.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#@cdevhub/ngx-tw@}"
          PKG_VERSION=$(node -p "require('./dist/ngx-tw/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "✖ Tag $GITHUB_REF_NAME does not match dist version $PKG_VERSION"
            exit 1
          fi
          echo "✓ Tag matches dist version: $PKG_VERSION"

      - name: Extract release notes from CHANGELOG
        id: notes
        # MUST run BEFORE `npm publish`. This step exits 1 when the CHANGELOG
        # has no section for the tag's version, and an npm publish cannot be
        # undone (unpublish is restricted to a 72h window and burns the version
        # number forever). Running it after the publish — as this workflow did
        # until the v22 audit — turns a missing changelog heading into "package
        # is public, workflow is red, no GitHub Release", which is the worst of
        # both. Ordering it here makes that failure cost nothing.
        #
        # `GITHUB_REF_NAME` is the tag (`@cdevhub/ngx-tw@0.2.1`); strip the tag
        # prefix inside node so we read the env var that GitHub Actions
        # actually exports, not a non-exported bash variable.
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME;
            const v = tag.replace(/^@cdevhub\/ngx-tw@/, '');
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = md.split('\n');
            const escaped = v.replace(/\./g, '\\\\.');
            const headRe = new RegExp('^## (\\\\[' + escaped + '\\\\]|' + escaped + ')(\\\\s|\$)');
            const start = lines.findIndex(l => headRe.test(l));
            if (start === -1) { console.error('No CHANGELOG section for ' + v); process.exit(1); }
            const next = lines.findIndex((l, i) => i > start && l.startsWith('## '));
            const body = lines.slice(start + 1, next === -1 ? lines.length : next).join('\n').trim();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'notes<<__END__\n' + body + '\n__END__\n');
          "

      - name: Publish to npm
        # Everything above this line is a gate. Nothing below it can un-publish.
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # SHA-pinned for supply-chain safety — this is the highest-trust job
        # (contents:write, id-token:write, npm token in scope). Pin == v2.6.2.
        # Bump via dependabot (github-actions ecosystem).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
