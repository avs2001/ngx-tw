name: release

# Release pipeline for ngx-tw.
#
# Two-stage flow driven by the Changesets action:
#   1. On push to `develop` with pending `.changeset/*.md` files, the action
#      opens (or updates) a "Version Packages" PR that bumps the library
#      version and regenerates CHANGELOG.md.
#   2. When that PR is merged, the next push to `develop` finds no pending
#      changesets — the action runs `changeset:publish`, which builds the lib
#      and publishes `dist/ngx-tw/` to npm, then creates a matching GitHub
#      release + tag.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  # Only one release pipeline at a time — prevents racing publishes.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # create tags, releases, push Version Packages PR
      pull-requests: write  # open/update the Version Packages PR
      id-token: write       # required for `npm publish --provenance` attestation
      # NOTE: provenance also requires `NPM_TOKEN` to be a Granular Access Token
      # (or legacy Automation token) from a 2FA-enabled npm account. A classic
      # "Read+Write" token will fail the publish, not silently skip provenance.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so changesets can compute the changelog diff.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Sanity build before any publish decision
        # If the lib doesn't build cleanly, we should never reach `npm publish`.
        run: npm run build:lib

      - name: Run unit tests
        run: npm run test:ci

      - name: Verify publishable tarball
        # Mirrors the ci.yml pack-check job — the release path must enforce the
        # same tarball-content guarantees CI does (README, LICENSE, manifest).
        run: |
          cd dist/ngx-tw
          npm pack --dry-run --json | tee ../pack-manifest.json
          node -e "
            const m = require('../pack-manifest.json')[0];
            const must = ['README.md', 'LICENSE', 'package.json'];
            const have = new Set(m.files.map(f => f.path));
            const missing = must.filter(f => !have.has(f));
            if (missing.length) { console.error('Missing files in tarball:', missing); process.exit(1); }
            console.log('Tarball OK —', m.files.length, 'files,', (m.size/1024).toFixed(1), 'KB');
          "

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # When pending changesets exist → open/update the Version Packages PR.
          version: npm run changeset:version
          # When pending changesets are gone (PR was merged) → publish to npm.
          publish: npm run changeset:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
