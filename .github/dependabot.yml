version: 2

# Keep dependencies and pinned GitHub Actions patched. PRs target `develop`
# (the repo's working branch) so they flow through the same CI/e2e gate.
updates:
  # npm dependencies for the monorepo root (covers the ngx-tw workspace).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Angular core + CDK + build move in lockstep; one PR avoids partial
      # major bumps that break the build.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - angular-eslint
          - ng-packagr
      # Test/lint tooling churns often on patch/minor — batch it.
      #
      # `exclude-patterns` is load-bearing, not decoration. Four of the
      # Angular family are devDependencies (`@angular/build`, `@angular/cli`,
      # `@angular/compiler-cli`, `ng-packagr`), so they match
      # `dependency-type: development` and can be sorted into this group
      # instead of `angular` above. When that happened, the two groups
      # shipped a *partial* Angular set each: PR #45 raised the runtime
      # packages while leaving `compiler-cli` behind, PR #51 raised
      # `compiler-cli` while leaving `compiler` behind. `compiler-cli`
      # peer-pins `compiler` at an exact version, so both PRs failed
      # `npm ci` with a mirrored ERESOLVE and neither could be merged —
      # not even together. `ng-packagr` proved the leak: it appeared in
      # both PRs, grouped one way on one run and the other way on the next.
      # Keep these patterns in sync with the `angular` group above.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - angular-eslint
          - ng-packagr
        update-types:
          - minor
          - patch
    # Majors that the Angular 22 toolchain forbids outright. Each was opened,
    # failed `npm ci` with ERESOLVE before compiling anything, and was closed —
    # they cannot pass until Angular widens its own peer range, so re-proposing
    # them weekly is pure noise. REMOVE the matching entry the moment
    # `@angular/build`'s peer range moves; check with
    # `npm view @angular/build peerDependencies`.
    ignore:
      # @angular/build@22.1.x → typescript ">=6.0 <6.1"
      # typescript-eslint@8.x → typescript ">=4.8.4 <6.1.0"   (two peers, both cap it)
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @angular/build@22.1.x → vitest "^4.0.8"
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      # NOTE: `tailwind-variants` majors are deliberately NOT ignored. That bump
      # is blocked by *our* work, not by upstream — it needs tailwind-merge 3.x
      # alongside it, two published peer ranges widened, ~57 tv() call sites
      # reviewed and a semver-major release. A weekly PR is a standing reminder
      # of real debt; silencing it would hide work we intend to do.

  # Pinned action SHAs/tags (e.g. softprops/action-gh-release) get tracked
  # and bumped here, with the pin comment kept in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
